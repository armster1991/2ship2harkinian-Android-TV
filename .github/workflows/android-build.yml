name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool

      - name: Install latest SDL
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
          tar -xzf SDL2-2.28.5.tar.gz
          cd SDL2-2.28.5
          ./configure --enable-hidapi-libusb
          make -j "$(nproc)"
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install latest tinyxml2
        run: |
          sudo apt-get remove -y libtinyxml2-dev
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz
          cd tinyxml2-10.0.0
          mkdir -p build && cd build
          cmake ..
          make
          sudo make install

      - name: Generate 2ship.o2r
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-cmake --config Release --target Generate2ShipOtr -j"$(nproc)"
          # This is the file the Android app tries to copy out of its bundled assets at
          # first launch (MainActivity.java: getAssets().open("2ship.o2r")). Without this
          # step, Android/app/src/main/assets/2ship.o2r never exists, so the app crashes /
          # fails with "Error copying 2ship.o2r" on the very first run - it's not bundled
          # by Gradle on its own, it has to be generated and placed here first.
          cp 2ship.o2r Android/app/src/main/assets/2ship.o2r

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;26.0.10792818"

      - name: Install CMake 3.28.3
        run: |
          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz \
            -o cmake.tar.gz

          mkdir -p "$HOME/cmake-3.28.3"
          tar -xzf cmake.tar.gz \
            --strip-components=1 \
            -C "$HOME/cmake-3.28.3"

          echo "$HOME/cmake-3.28.3/bin" >> "$GITHUB_PATH"
          echo "cmake.dir=$HOME/cmake-3.28.3" >> Android/local.properties

      - name: Make Gradle executable
        run: chmod +x Android/gradlew

      - name: Build release APK
        working-directory: Android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        run: |
          UNSIGNED_APK=$(find Android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)

          "$ANDROID_HOME/build-tools/33.0.2/apksigner" sign \
            --ks Android/app/release.jks \
            --ks-key-alias armster-2s2h \
            --ks-pass pass:ShipOfHarkinianMM2026! \
            --key-pass pass:ShipOfHarkinianMM2026! \
            --out Android/app/build/outputs/apk/release/2ship-android-tv-signed.apk \
            "$UNSIGNED_APK"

          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify \
            --verbose \
            Android/app/build/outputs/apk/release/2ship-android-tv-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2ship-android-tv-apk
          path: Android/app/build/outputs/apk/release/2ship-android-tv-signed.apk
          if-no-files-found: error
