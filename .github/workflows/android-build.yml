name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;26.0.10792818"

      - name: Install CMake 3.28.3
        run: |
          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz \
            -o cmake.tar.gz

          mkdir -p "$HOME/cmake-3.28.3"
          tar -xzf cmake.tar.gz \
            --strip-components=1 \
            -C "$HOME/cmake-3.28.3"

          echo "$HOME/cmake-3.28.3/bin" >> "$GITHUB_PATH"
          echo "cmake.dir=$HOME/cmake-3.28.3" >> Android/local.properties

      - name: Make Gradle executable
        run: chmod +x Android/gradlew

      - name: Build release APK
        working-directory: Android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2ship-android-tv-apk
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
